<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-asg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#151c28"/>
    </linearGradient>
    <linearGradient id="line-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ff9933" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9933" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg-asg)" rx="8"/>
  <rect x="1" y="1" width="598" height="338" fill="none" stroke="#ff9933" stroke-opacity="0.15" rx="7"/>
  <!-- Grid overlay -->
  <pattern id="grid-asg" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
  </pattern>
  <rect width="600" height="340" fill="url(#grid-asg)"/>
  <!-- Title Badge -->
  <rect x="30" y="24" width="130" height="22" rx="4" fill="#ff9933" fill-opacity="0.12" stroke="#ff9933" stroke-opacity="0.3"/>
  <text x="95" y="39" fill="#ff9933" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">AWS LIFECYCLE</text>
  <!-- Main Flow Diagram -->
  <!-- ALB Node -->
  <rect x="30" y="80" width="130" height="70" rx="6" fill="#1a2230" stroke="#388bfd" stroke-width="1.5"/>
  <text x="95" y="110" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Application LB</text>
  <text x="95" y="132" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Health Checks / WAF</text>
  <!-- Arrow 1 -->
  <path d="M 160 115 L 210 115" stroke="#ff9933" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="215,115 207,111 207,119" fill="#ff9933"/>
  <!-- ASG Node -->
  <rect x="220" y="65" width="160" height="100" rx="6" fill="#182333" stroke="#ff9933" stroke-width="1.5"/>
  <rect x="230" y="75" width="140" height="20" rx="3" fill="#ff9933" fill-opacity="0.15"/>
  <text x="300" y="89" fill="#ff9933" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Auto Scaling Group</text>
  <text x="300" y="122" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">EC2 Target Instances</text>
  <text x="300" y="145" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">● Lifecycle: InService</text>
  <!-- Arrow 2 -->
  <path d="M 380 115 L 430 115" stroke="#ff9933" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="435,115 427,111 427,119" fill="#ff9933"/>
  <!-- CodeDeploy Node -->
  <rect x="440" y="80" width="130" height="70" rx="6" fill="#1a2230" stroke="#3fb950" stroke-width="1.5"/>
  <text x="505" y="110" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">AWS CodeDeploy</text>
  <text x="505" y="132" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Hook Sequencing</text>
  <!-- Lower Hook Pipeline -->
  <rect x="30" y="200" width="540" height="105" rx="6" fill="#111620" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="226" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">HOOK EXECUTION &amp; DRAIN SEQUENCE</text>
  <g transform="translate(50, 245)">
    <rect x="0" y="0" width="110" height="38" rx="4" fill="#182333" stroke="#388bfd" stroke-width="1"/>
    <text x="55" y="18" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">BeforeInstall</text>
    <text x="55" y="30" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Drain Traffic</text>
  </g>
  <path d="M 165 264 L 185 264" stroke="#484f58" stroke-width="2"/>
  <g transform="translate(190, 245)">
    <rect x="0" y="0" width="110" height="38" rx="4" fill="#182333" stroke="#ff9933" stroke-width="1"/>
    <text x="55" y="18" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ApplicationStart</text>
    <text x="55" y="30" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Service Boot</text>
  </g>
  <path d="M 305 264 L 325 264" stroke="#484f58" stroke-width="2"/>
  <g transform="translate(330, 245)">
    <rect x="0" y="0" width="110" height="38" rx="4" fill="#182333" stroke="#d29922" stroke-width="1"/>
    <text x="55" y="18" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ValidateService</text>
    <text x="55" y="30" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Warm-up Ping</text>
  </g>
  <path d="M 445 264 L 465 264" stroke="#484f58" stroke-width="2"/>
  <g transform="translate(470, 245)">
    <rect x="0" y="0" width="85" height="38" rx="4" fill="#182333" stroke="#3fb950" stroke-width="1"/>
    <text x="42" y="18" fill="#7ee787" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Healthy</text>
    <text x="42" y="30" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Resume</text>
  </g>
</svg>