<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cqrs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#181c26"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg-cqrs)" rx="8"/>
  <rect x="1" y="1" width="598" height="338" fill="none" stroke="#ff9933" stroke-opacity="0.15" rx="7"/>
  <!-- Title Badge -->
  <rect x="30" y="24" width="170" height="22" rx="4" fill="#ff9933" fill-opacity="0.12" stroke="#ff9933" stroke-opacity="0.3"/>
  <text x="115" y="39" fill="#ff9933" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">CLEAN ARCHITECTURE</text>
  <!-- CQRS Split -->
  <!-- API Controller Entry -->
  <rect x="30" y="115" width="100" height="80" rx="6" fill="#1a2230" stroke="#ff9933" stroke-width="1.5"/>
  <text x="80" y="145" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ASP.NET</text>
  <text x="80" y="162" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Controllers</text>
  <text x="80" y="180" fill="#ff9933" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">MediatR.Send</text>
  <!-- Fork Lines -->
  <path d="M 130 145 L 180 95" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 130 165 L 180 215" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Query Pipeline (Top) -->
  <g transform="translate(190, 60)">
    <rect x="0" y="0" width="165" height="70" rx="6" fill="#16202c" stroke="#388bfd" stroke-width="1"/>
    <text x="15" y="22" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">QUERY PIPELINE</text>
    <text x="15" y="42" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="11">CacheFactory.GetAsync</text>
    <text x="15" y="58" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">Redis Namespace Isolation</text>
  </g>
  <!-- Path Query to Redis -->
  <path d="M 355 95 L 395 95" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="400,95 392,91 392,99" fill="#bc8cff"/>
  <!-- Command Pipeline (Bottom) -->
  <g transform="translate(190, 180)">
    <rect x="0" y="0" width="165" height="70" rx="6" fill="#17241e" stroke="#3fb950" stroke-width="1"/>
    <text x="15" y="22" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">COMMAND PIPELINE</text>
    <text x="15" y="42" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="11">IUnitOfWork &amp; Result&lt;T&gt;</text>
    <text x="15" y="58" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">Domain Validations</text>
  </g>
  <!-- Path Command to MySQL -->
  <path d="M 355 215 L 395 215" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="400,215 392,211 392,219" fill="#388bfd"/>
  <!-- Storage Layer (Right) -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="170" height="70" rx="6" fill="#1d192b" stroke="#bc8cff" stroke-width="1"/>
    <text x="85" y="25" fill="#d2a8ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">REDIS CACHE</text>
    <text x="85" y="46" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">In-Memory Responses</text>
    <text x="85" y="60" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Sub-millisecond reads</text>
  </g>
  <g transform="translate(400, 180)">
    <rect x="0" y="0" width="170" height="70" rx="6" fill="#1c212a" stroke="#388bfd" stroke-width="1"/>
    <text x="85" y="25" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">MYSQL DATABASE</text>
    <text x="85" y="46" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">EF Core / Transactions</text>
    <text x="85" y="60" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Liquibase Migrations</text>
  </g>
  <!-- Background Jobs Footer -->
  <rect x="30" y="268" width="540" height="50" rx="6" fill="#111620" stroke="#30363d" stroke-width="1"/>
  <text x="48" y="288" fill="#ff9933" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">BACKGROUND HOSTED SERVICES:</text>
  <text x="48" y="306" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">Scheduled Cron Jobs ● Broadcast Delivery ● Wearable Sync ● Analytics Aggregates</text>
</svg>